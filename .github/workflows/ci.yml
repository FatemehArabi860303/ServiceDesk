name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ServiceDesk.slnx

      - name: Build
        run: dotnet build ServiceDesk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ServiceDesk.slnx --configuration Release --no-build
